<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heat-wave viewer</title>
<style>
  :root {
    --bg: #f4f4f1; --panel: #ffffff; --fg: #1c1c1a; --muted: #6b6b66; --faint: #a3a39c;
    --line: #e2e2dc; --hover: #f0efea; --accent: #b3261e; --accent-soft: #fbe7e4;
    --ocean: #e6edf3; --land: #d8d7d0; --coast: #8f8e87; --grid: rgba(0, 0, 0, .08);
    --other: #8c96a8; --hl: #b4cfe8; --trail-lo: #fcdcbc; --trail-hi: #e0702e; --today: #b3261e;
    --future: #e2e2dc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) {
      --bg: #121211; --panel: #1b1b1a; --fg: #ececea; --muted: #9a9a94; --faint: #6a6a65;
      --line: #2e2e2b; --hover: #252523; --accent: #ff6b5a; --accent-soft: #3a1d19;
      --ocean: #121a22; --land: #2a2a27; --coast: #66655f; --grid: rgba(255, 255, 255, .07);
      --other: #5f6a7c; --hl: #27455f; --trail-lo: #4f2e1c; --trail-hi: #dd7a3c; --today: #ff5a45;
      --future: #2e2e2b;
      color-scheme: dark;
    }
  }
  :root[data-theme=dark] {
      --bg: #121211; --panel: #1b1b1a; --fg: #ececea; --muted: #9a9a94; --faint: #6a6a65;
      --line: #2e2e2b; --hover: #252523; --accent: #ff6b5a; --accent-soft: #3a1d19;
      --ocean: #121a22; --land: #2a2a27; --coast: #66655f; --grid: rgba(255, 255, 255, .07);
      --other: #5f6a7c; --hl: #27455f; --trail-lo: #4f2e1c; --trail-hi: #dd7a3c; --today: #ff5a45;
      --future: #2e2e2b;
      color-scheme: dark;
  }
  :root[data-theme=light] { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  @media (max-width: 820px) { .app { grid-template-columns: 1fr; height: auto; } }

  /* Sidebar */
  aside { background: var(--panel); border-right: 1px solid var(--line);
          display: flex; flex-direction: column; min-height: 0; }
  .head { padding: 20px 20px 4px; }
  h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .group { padding: 14px 20px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .group h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
              color: var(--muted); margin: 0; }
  .field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
           border-radius: 7px; padding: 6px 8px; width: 100%; }
  .seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .seg label { flex: 1; text-align: center; cursor: pointer; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: block; padding: 4px 0; border-radius: 6px; color: var(--fg); font-size: 13px;
              font-variant-numeric: tabular-nums; transition: background .12s; }
  .seg input:checked + span { background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 1px var(--line);
                              font-weight: 600; }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
  .ref { font-size: 11px; color: var(--faint); }
  .theme { margin-top: 12px; }
  .theme span { font-size: 12px; padding: 3px 0; }
  .filters { border-bottom: 1px solid var(--line); }
  .filters summary { padding: 12px 20px; cursor: pointer; display: flex; align-items: center; gap: 8px; list-style: none; }
  .filters summary::-webkit-details-marker { display: none; }
  .filters summary::after { content: "›"; margin-left: auto; color: var(--muted); font-size: 16px; transition: transform .15s; }
  .filters[open] summary::after { transform: rotate(90deg); }
  .filters summary h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; }
  #active:not(:empty) { font-size: 11px; color: #fff; background: var(--accent); border-radius: 9px; padding: 0 7px; }
  .filter-body { padding: 0 20px 14px; display: grid; gap: 10px; }
  .filter-body .link { justify-self: start; }
  .check { display: grid; grid-template-columns: auto 1fr; gap: 0 8px; align-items: center; cursor: pointer; }
  .check input { accent-color: var(--accent); margin: 0; }
  .check small { grid-column: 2; font-size: 11px; color: var(--faint); }
  .link { background: none; border: 0; padding: 0; font: inherit; font-size: 12px; color: var(--accent); cursor: pointer; }
  .lab { display: flex; justify-content: space-between; }
  .lab b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; margin: 2px 0 0; accent-color: var(--accent); }
  .setting { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .setting .seg { background: var(--bg); }

  .events-head { display: flex; justify-content: space-between; align-items: baseline;
                 padding: 14px 20px 6px; }
  .events-head { gap: 8px; align-items: center; }
  .events-head small { color: var(--muted); font-size: 12px; margin-right: auto; }
  .sort { width: auto; padding: 3px 6px; font-size: 12px; }
  #events { list-style: none; margin: 0; padding: 0 10px 16px; overflow-y: auto; flex: 1; min-height: 200px; }
  #events li { display: grid; grid-template-columns: 34px 1fr auto; gap: 2px 8px; padding: 8px 10px;
               border-radius: 8px; cursor: pointer; }
  #events li:hover { background: var(--hover); }
  #events li[aria-selected=true] { background: var(--accent-soft); }
  #events li[aria-selected=true] .rank { color: var(--accent); }
  .rank { grid-row: span 3; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); padding-top: 1px; }
  .dates { font-weight: 550; }
  .val { font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; }
  .meta, .bar { grid-column: 2 / 4; }
  .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #events li > * { min-width: 0; }
  .bar { height: 3px; border-radius: 2px; background: var(--line); margin-top: 3px; }
  .bar i { display: block; height: 100%; border-radius: 2px; background: var(--trail-hi); }
  .empty { color: var(--muted); padding: 12px 10px; }

  /* Stage */
  .stage { padding: 20px 24px; overflow-y: auto; display: grid; gap: 20px; align-content: start;
           grid-template-columns: minmax(0, calc((100vh - 170px) * var(--ar, 1.4))) 250px;
           justify-content: center; }
  .mapcol { display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 0;
            --w: 100%; }
  .mapcol > * { width: var(--w); flex-shrink: 0; }
  .info { display: flex; flex-direction: column; gap: 12px; }
  @media (max-width: 1100px) {
    .stage { grid-template-columns: 1fr; }
    .mapcol { --w: min(100%, calc((100vh - 250px) * var(--ar, 1.4))); }
  }
  .mapwrap { position: relative; border-radius: 12px; overflow: hidden;
             border: 1px solid var(--line); background: var(--ocean); }
  .mapwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #map { image-rendering: pixelated; }
  .pop { position: absolute; z-index: 2; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
         padding: 10px 12px; box-shadow: 0 6px 20px rgba(0,0,0,.25); min-width: 170px; transform: translate(-50%, calc(-100% - 10px)); }
  .pop b { display: block; font-size: 15px; }
  .pop small { color: var(--muted); font-size: 12px; display: block; margin-top: 2px; }
  .pop .link { margin-top: 8px; }
  .card.wide { grid-column: 1 / -1; }
  .shares { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 3px; font-size: 13px; }
  .shares li { display: grid; grid-template-columns: 1fr auto; gap: 8px; position: relative; padding: 1px 4px; }
  .shares li::before { content: ""; position: absolute; inset: 0; width: var(--p); background: var(--accent-soft); border-radius: 3px; z-index: -1; }
  .shares span { font-variant-numeric: tabular-nums; color: var(--muted); }
  .card { position: relative; isolation: isolate; }
  .badge { position: absolute; top: 12px; left: 12px; background: color-mix(in srgb, var(--panel) 88%, transparent);
           backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
           font-variant-numeric: tabular-nums; pointer-events: none; }
  .badge .date { font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
  .badge .daynum, .badge .where { font-size: 12px; color: var(--muted); }
  .legend { position: absolute; bottom: 12px; left: 12px; display: flex; gap: 12px; flex-wrap: wrap;
            background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(6px);
            border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px;
            color: var(--muted); align-items: center; }
  .legend label { display: flex; align-items: center; gap: 0; cursor: pointer; }
  .legend input { margin: 0 6px 0 0; accent-color: var(--accent); }
  .legend input:not(:checked) ~ i { opacity: .35; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .legend .ramp { width: 44px; background: linear-gradient(90deg, var(--trail-lo), var(--trail-hi)); }

  .player { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
            padding: 10px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; }
  .buttons { display: flex; gap: 4px; }
  .buttons button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
                    background: var(--bg); color: var(--fg); cursor: pointer; display: grid; place-items: center; }
  .buttons button:hover { background: var(--hover); }
  #play { width: 42px; background: var(--accent); border-color: var(--accent); color: #fff; }
  #play:hover { filter: brightness(1.08); background: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { width: 14px; height: 14px; fill: currentColor; }
  .timeline { display: grid; gap: 2px; }
  #spark { width: 100%; height: 44px; display: block; cursor: pointer; touch-action: none; }
  .tl-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint);
             font-variant-numeric: tabular-nums; }
  .speed { width: 170px; }
  @media (max-width: 820px) { .player { grid-template-columns: 1fr; } .speed { width: 100%; } }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0; }
  @media (max-width: 1100px) { .stats { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .card dt { font-size: 12px; color: var(--muted); }
  .card dd { margin: 2px 0 0; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .card dd small { font-size: 12px; font-weight: 400; color: var(--muted); }
  .keys { font-size: 12px; color: var(--faint); }
  kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--panel); }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="head">
      <h1>Heat-wave catalogue</h1>
      <div class="sub" id="sub"></div>
      <div class="seg theme" id="theme" aria-label="Colour theme"></div>
    </div>
    <div class="group">
      <div class="row">
        <label class="field">Year <select id="year"></select></label>
        <label class="field">Month <select id="month"></select></label>
      </div>
    </div>
    <details class="filters">
      <summary><h2>Filter events</h2><span id="active"></span></summary>
      <div class="filter-body">
      <button id="reset" class="link">Reset filters</button>
      <label class="check"><input type="checkbox" id="europe" checked> European events only<small>Hide events that touch no European country</small></label>
      <label class="field">Country <select id="country"></select></label>
      <label class="field">Climate zone <select id="zone"></select></label>
      <label class="field"><span class="lab">Min duration <b id="minDaysV"></b></span>
        <input type="range" id="minDays" min="3" max="30" step="1" value="3"></label>
      <label class="field"><span class="lab">Min peak area <b id="minAreaV"></b></span>
        <input type="range" id="minArea" min="0" max="3000000" step="50000" value="0"></label>
      <label class="field"><span class="lab">Min max anomaly (one cell) <b id="minAnomV"></b></span>
        <input type="range" id="minAnom" min="0" max="12" step="0.5" value="0"></label>
      </div>
    </details>
    <div class="events-head"><h2 style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0">Events</h2><small id="count"></small><select id="sort" class="sort" aria-label="Sort events by"><option value="rank">By rank</option><option value="start">By date</option><option value="duration_days">By duration</option><option value="peak_area_km2">By peak area</option><option value="max_anom_C">By max anomaly</option><option value="peak_tmax_C">By peak Tmax</option></select></div>
    <ul id="events" role="listbox" aria-label="Events"></ul>
  </aside>

  <section class="stage">
    <div class="mapcol">
    <div class="mapwrap" id="mapwrap">
      <canvas id="map"></canvas>
      <canvas id="overlay"></canvas>
      <div class="badge">
        <div class="date" id="date">–</div>
        <div class="daynum" id="daynum"></div>
        <div class="where" id="where"></div>
      </div>
      <div class="pop" id="pop" hidden></div>
      <div class="legend">
        <span><i style="background:var(--today)"></i>Event today</span>
        <label><input type="checkbox" id="showTrail"><i class="ramp"></i>Earlier days (1 → most)</label>
        <label><input type="checkbox" id="showOther"><i style="background:var(--other)"></i>Other events today</label>
      </div>
    </div>

    <div class="player">
      <div class="buttons">
        <button id="prev" aria-label="Previous day"><svg viewBox="0 0 16 16"><path d="M4 3h2v10H4zM13 3v10L7 8z"/></svg></button>
        <button id="play" aria-label="Play"><svg viewBox="0 0 16 16" id="playicon"><path d="M4 2l10 6-10 6z"/></svg></button>
        <button id="next" aria-label="Next day"><svg viewBox="0 0 16 16"><path d="M10 3h2v10h-2zM3 3v10l6-5z"/></svg></button>
      </div>
      <div class="timeline">
        <canvas id="spark" aria-label="Daily event area; click to jump to a day"></canvas>
        <div class="tl-axis"><span id="tl-start"></span><span>Area covered each day</span><span id="tl-end"></span></div>
      </div>
      <div class="field">Speed<div class="seg speed" id="speed"></div></div>
    </div>
    </div>
    <div class="info">
      <div class="group setting">
        <h2>Detector setting</h2>
        <div class="field">Minimum area (km²)<div class="seg" id="area"></div></div>
        <div class="field">Percentile<div class="seg" id="pct"></div></div>
        <div class="field">Threshold window (days)<div class="seg" id="window"></div></div>
        <div class="ref">Reference: 50k km², 90th, 15 days</div>
      </div>

    <dl class="stats" id="stats"></dl>
    <div class="keys"><kbd>Space</kbd> play or pause · <kbd>←</kbd> <kbd>→</kbd> step a day · <kbd>↑</kbd> <kbd>↓</kbd> previous or next event</div>
    </div>
  </section>
</div>
<script>
const D = /*DATA*/null;
const $ = id => document.getElementById(id);
const MONTHS = ["All months", "January", "February", "March", "April", "May", "June", "July",
                "August", "September", "October", "November", "December"];
const col = Object.fromEntries(D.columns.map((c, k) => [c, k]));
const DAY = 86400000, R_KM = 6371, RAD = Math.PI / 180;
const PLAY = '<path d="M4 2l10 6-10 6z"/>', PAUSE = '<path d="M3 2h4v12H3zM9 2h4v12H9z"/>';
const fmtDate = (ms, opts = { day: "numeric", month: "short", year: "numeric" }) =>
  new Date(ms).toLocaleDateString("en-GB", { timeZone: "UTC", ...opts });
const fmtArea = km2 => km2 >= 1e6 ? `${(km2 / 1e6).toFixed(2)}M km²` : `${Math.round(km2 / 1e3)}k km²`;

async function unpack(b64) {
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Response(stream).arrayBuffer();
}

function seg(id, values, labels, initial, onchange) {
  $(id).innerHTML = values.map((v, k) =>
    `<label><input type="radio" name="${id}" value="${v}"${v == initial ? " checked" : ""}><span>${labels[k]}</span></label>`).join("");
  $(id).onchange = onchange;
}
const val = id => document.querySelector(`input[name=${id}]:checked`).value;

// The grid is plate carree; squash its width by cos(mid-latitude) so Europe
// keeps roughly its true shape.
const midLat = D.lat0 + D.dlat * (D.ny - 1) / 2;
const AR = D.nx * Math.cos(midLat * RAD) / D.ny;
$("mapwrap").style.aspectRatio = AR;
document.querySelector(".stage").style.setProperty("--ar", AR);
const cellKm2 = i => R_KM * R_KM * Math.abs(D.dlat * D.dlon) * RAD * RAD * Math.cos((D.lat0 + i * D.dlat) * RAD);

const canvas = $("map"), ctx = canvas.getContext("2d");
canvas.width = D.nx; canvas.height = D.ny;
const img = ctx.createImageData(D.nx, D.ny);
const count = new Uint16Array(D.nx * D.ny);
let land, country, zoneCell, run, cache = {}, events = [], frames = [], areas = [], frame = 0, timer = null, selected = null;

function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function rgb(name) { const c = css(name); return [1, 3, 5].map(k => parseInt(c.slice(k, k + 2), 16)); }
const palette = () => Object.fromEntries(["ocean", "land", "hl", "other", "trail-lo", "trail-hi", "today"]
  .map(n => [n, rgb(`--${n}`)]));

async function loadRun(key) {
  if (cache[key]) return cache[key];
  const r = D.runs[key];
  if (!r) return null;
  const buf = await unpack(r.cells), n = r.n;
  const out = { ...r, eid: new Int32Array(buf, 0, n), t: new Int16Array(buf, 4 * n, n),
                i: new Int16Array(buf, 6 * n, n), j: new Int16Array(buf, 8 * n, n) };
  // Cell-days come sorted by day, so each day is one contiguous slice.
  const days = out.t[n - 1] + 2;
  out.dayStart = new Int32Array(days);
  for (let k = 0, d = 0; d < days; d++) {
    while (k < n && out.t[k] < d) k++;
    out.dayStart[d] = k;
  }
  out.t0 = Date.parse(r.t0);
  // Area-days each event spent over each country, for shares and the filter.
  out.byCountry = new Map();
  for (let k = 0; k < n; k++) {
    let a = out.byCountry.get(out.eid[k]);
    if (!a) out.byCountry.set(out.eid[k], a = new Float64Array(D.countries.length));
    a[country[out.i[k] * D.nx + out.j[k]]] += cellKm2(out.i[k]);
  }
  return (cache[key] = out);
}

// [country index, share of the event's area-days], largest first.
function shares(e) {
  const a = run.byCountry.get(e[col.event_id]), total = a.reduce((x, y) => x + y, 0);
  return [...a].map((v, c) => [c, v / total]).filter(([c, f]) => c && f > 0).sort((x, y) => y[1] - x[1]);
}
const pct = f => f >= .01 ? `${Math.round(100 * f)}%` : "<1%";
function topCountries(e, n) {
  const s = shares(e);
  return s.slice(0, n).map(([c]) => D.countries[c]).join(", ");
}
function cellAt(ev) {
  const r = $("mapwrap").getBoundingClientRect();
  const i = Math.floor((ev.clientY - r.top) / r.height * D.ny), j = Math.floor((ev.clientX - r.left) / r.width * D.nx);
  return { i, j, x: ev.clientX - r.left, y: ev.clientY - r.top,
           lat: D.lat0 + i * D.dlat, lon: D.lon0 + j * D.dlon, c: country[i * D.nx + j] };
}

async function onSetting() {
  stop();
  const keep = selected && +selected[col.rank];
  run = await loadRun(`${$("year").value}_a${val("area")}k_p${val("pct")}_w${val("window")}`);
  const m = +$("month").value, y = +$("year").value;
  const ctry = +$("country").value, zone = $("zone").value, minDays = +$("minDays").value, minArea = +$("minArea").value,
        minAnom = +$("minAnom").value;
  $("minDaysV").textContent = `${minDays} days`;
  $("minAreaV").textContent = minArea ? fmtArea(minArea) : "any";
  $("minAnomV").textContent = minAnom ? `+${minAnom} °C` : "any";
  const europe = $("europe").checked;
  const active = [!europe, ctry, zone, minDays > 3, minArea, minAnom].filter(Boolean).length;
  $("active").textContent = active ? `${active} active` : "";
  events = (run ? run.events : []).filter(e =>
    (!m || (Date.parse(e[col.start]) < Date.UTC(y, m, 1) && Date.parse(e[col.end]) >= Date.UTC(y, m - 1, 1))) &&
    (!europe || run.byCountry.get(e[col.event_id]).some((v, c) => v > 0 && D.european[c])) &&
    (!ctry || run.byCountry.get(e[col.event_id])[ctry] > 0) && (!zone || e[col.zone] === zone) && e[col.duration_days] >= minDays &&
    e[col.peak_area_km2] >= minArea && e[col.max_anom_C] >= minAnom);
  const by = $("sort").value, c = col[by];
  // Rank and date read best smallest first; the measures, largest first.
  events.sort(by === "rank" ? (a, b) => a[c] - b[c] : by === "start" ? (a, b) => a[c].localeCompare(b[c])
                            : (a, b) => b[c] - a[c]);
  // Each row shows, and its bar measures, whatever the list is sorted by.
  // Key order is also the order the detail line fills from.
  const show = { duration_days: v => `${v} days`, peak_area_km2: fmtArea,
                 peak_tmax_C: v => `${v.toFixed(1)} °C`, max_anom_C: v => `+${v.toFixed(1)} °C` };
  const key = show[by] ? by : "peak_area_km2", kc = col[key];
  const top = Math.max(...events.map(e => e[kc]), 1e-9);
  $("count").textContent = `${events.length} event${events.length === 1 ? "" : "s"}`;
  $("events").innerHTML = events.length ? events.map((e, k) => `
    <li role="option" data-k="${k}">
      <span class="rank">#${e[col.rank]}</span>
      <span class="dates">${fmtDate(Date.parse(e[col.start]), { day: "numeric", month: "short" })} – ${fmtDate(Date.parse(e[col.end]), { day: "numeric", month: "short" })}</span>
      <span class="val">${show[key](e[kc])}</span>
      <span class="meta">${[...Object.keys(show).filter(c => c !== key).slice(0, 2).map(c => show[c](e[col[c]])),
        topCountries(e, 2)].join(" · ")}</span>
      <span class="bar"><i style="width:${100 * e[kc] / top}%"></i></span>
    </li>`).join("") : `<li class="empty">No events match these filters.</li>`;
  // Changing the setting renumbers events, so stay on the same rank instead.
  const k = Math.max(0, events.findIndex(e => e[col.rank] === keep));
  select(events.length ? k : -1);
}

function select(k) {
  stop();
  for (const li of $("events").children) li.setAttribute("aria-selected", li.dataset.k == k);
  selected = events[k] || null;
  $("events").children[k]?.scrollIntoView({ block: "nearest" });
  frames = []; areas = [];
  const e = selected;
  if (e) {
    const a = (Date.parse(e[col.start]) - run.t0) / DAY, b = (Date.parse(e[col.end]) - run.t0) / DAY;
    const id = e[col.event_id], ds = run.dayStart;
    for (let d = a; d <= b; d++) {
      let area = 0;
      for (let q = ds[d]; q < ds[d + 1]; q++) if (run.eid[q] === id) area += cellKm2(run.i[q]);
      frames.push(d); areas.push(area);
    }
  }
  frame = 0;
  $("tl-start").textContent = e ? fmtDate(Date.parse(e[col.start]), { day: "numeric", month: "short" }) : "";
  $("tl-end").textContent = e ? fmtDate(Date.parse(e[col.end]), { day: "numeric", month: "short" }) : "";
  const card = (label, value, note = "") => `<div class="card"><dt>${label}</dt><dd>${value}${note ? ` <small>${note}</small>` : ""}</dd></div>`;
  $("stats").innerHTML = e ? [
    card("Rank", `#${e[col.rank]}`, `of ${run.events.length}`),
    card("Duration", `${e[col.duration_days]} days`),
    card("Peak day", fmtDate(Date.parse(e[col.peak]), { day: "numeric", month: "short" })),
    card("Peak area", fmtArea(e[col.peak_area_km2])),
    card("Max anomaly (one cell)", `+${e[col.max_anom_C]} °C`),
    card("Peak Tmax", `${e[col.peak_tmax_C]} °C`),
    card("Centre", `${e[col.centroid_lat]}° N`, `${e[col.centroid_lon]}° E`),
    card("Climate zone", (e[col.zone] || "–").replace(/ \(.*\)/, ""), ((e[col.zone] || "").match(/\((.*)\)/) || [])[1] || ""),
    `<div class="card wide"><dt>Countries <small>(share of area × days)</small></dt><dd><ul class="shares">${
      shares(e).slice(0, 6).map(([c, f]) => `<li style="--p:${(100 * f).toFixed(1)}%">${D.countries[c]}<span>${pct(f)}</span></li>`).join("")
    }</ul></dd></div>`,
  ].join("") : "";
  draw();
}

function draw() {
  const c = palette(), px = img.data;
  const paint = (k, v) => { px[4 * k] = v[0]; px[4 * k + 1] = v[1]; px[4 * k + 2] = v[2]; px[4 * k + 3] = 255; };
  // Land in the filtered country and/or climate zone is shaded.
  const hc = +$("country").value, hz = D.zones.indexOf($("zone").value);
  for (let k = 0; k < D.nx * D.ny; k++)
    paint(k, !land[k] ? c.ocean
          : (hc || hz > 0) && (!hc || country[k] === hc) && (hz <= 0 || zoneCell[k] === hz) ? c.hl : c.land);
  const e = selected;
  if (e && frames.length) {
    const id = e[col.event_id], today = frames[frame], ds = run.dayStart;
    const cell = q => run.i[q] * D.nx + run.j[q];
    count.fill(0);
    let most = 1;
    if ($("showTrail").checked) for (let d = frames[0]; d < today; d++)
      for (let q = ds[d]; q < ds[d + 1]; q++)
        if (run.eid[q] === id) most = Math.max(most, ++count[cell(q)]);
    for (let k = 0; k < count.length; k++) if (count[k]) {
      const f = (count[k] - 1) / Math.max(most - 1, 1);
      paint(k, c["trail-lo"].map((lo, ch) => lo + f * (c["trail-hi"][ch] - lo)));
    }
    const other = $("showOther").checked;
    for (let q = ds[today]; q < ds[today + 1]; q++)
      if (run.eid[q] === id) paint(cell(q), c.today);
      else if (other) paint(cell(q), c.other);
    $("date").textContent = fmtDate(run.t0 + today * DAY);
    $("daynum").textContent = `Day ${frame + 1} of ${frames.length} · ${fmtArea(areas[frame])}`;
  } else {
    $("date").textContent = "No event";
    $("daynum").textContent = "";
  }
  ctx.putImageData(img, 0, 0);
  drawSpark();
}

// Coastline and graticule, drawn at screen resolution so they stay crisp.
function drawOverlay() {
  const o = $("overlay"), dpr = devicePixelRatio || 1, w = o.clientWidth, h = o.clientHeight;
  o.width = w * dpr; o.height = h * dpr;
  const g = o.getContext("2d");
  g.scale(dpr, dpr);
  const sx = w / D.nx, sy = h / D.ny;
  const x = lon => ((lon - D.lon0) / D.dlon + .5) * sx, y = lat => ((lat - D.lat0) / D.dlat + .5) * sy;
  g.strokeStyle = css("--grid"); g.lineWidth = 1; g.beginPath();
  g.fillStyle = css("--faint"); g.font = "11px system-ui, sans-serif";
  for (let lat = 40; lat <= 70; lat += 10) { g.moveTo(0, y(lat)); g.lineTo(w, y(lat)); g.fillText(`${lat}°N`, w - 34, y(lat) - 4); }
  for (let lon = -20; lon <= 40; lon += 10) { g.moveTo(x(lon), 0); g.lineTo(x(lon), h);
    g.fillText(`${Math.abs(lon)}°${lon < 0 ? "W" : "E"}`, x(lon) + 4, 14); }
  g.stroke();
  // Natural Earth outlines: coasts and country borders in one set of rings.
  g.strokeStyle = css("--coast"); g.lineWidth = 0.8; g.lineJoin = "round"; g.beginPath();
  for (const ring of D.borders) ring.forEach(([lo, la], k) => k ? g.lineTo(x(lo), y(la)) : g.moveTo(x(lo), y(la)));
  g.stroke();
}

function drawSpark() {
  const s = $("spark"), dpr = devicePixelRatio || 1, w = s.clientWidth, h = s.clientHeight;
  s.width = w * dpr; s.height = h * dpr;
  const g = s.getContext("2d");
  g.scale(dpr, dpr);
  if (!frames.length) return;
  const max = Math.max(...areas), bw = w / frames.length, gap = Math.min(2, bw * .25);
  areas.forEach((a, k) => {
    const bh = Math.max(2, (a / max) * (h - 4));
    g.fillStyle = css(k === frame ? "--today" : k < frame ? "--trail-hi" : "--future");
    g.beginPath();
    g.roundRect(k * bw + gap / 2, h - bh, bw - gap, bh, [Math.min(3, (bw - gap) / 2), Math.min(3, (bw - gap) / 2), 0, 0]);
    g.fill();
  });
}

function go(k) { frame = Math.max(0, Math.min(frames.length - 1, k)); draw(); }
function stop() { clearInterval(timer); timer = null; $("playicon").innerHTML = PLAY; $("play").ariaLabel = "Play"; }
function play() {
  if (!frames.length) return;
  if (frame >= frames.length - 1) frame = 0;
  $("playicon").innerHTML = PAUSE; $("play").ariaLabel = "Pause";
  draw();
  timer = setInterval(() => frame >= frames.length - 1 ? stop() : go(frame + 1), +val("speed"));
}

(async () => {
  const bits = new Uint8Array(await unpack(D.land));
  land = new Uint8Array(D.nx * D.ny).map((_, k) => (bits[k >> 3] >> (7 - (k & 7))) & 1);
  country = new Uint8Array(await unpack(D.country));
  zoneCell = new Uint8Array(await unpack(D.zone));
  $("sub").textContent = `ERA5 daily Tmax · ${D.years[0]}–${D.years.at(-1)} · ${D.years.length} summers`;
  $("year").innerHTML = D.years.map(y => `<option>${y}</option>`).join("");
  $("year").value = D.years.at(-1);
  $("month").innerHTML = MONTHS.map((m, k) => k === 0 || (k >= 4 && k <= 10) ? `<option value="${k}">${m}</option>` : "").join("");
  seg("area", D.areas, D.areas.map(a => `${a}k`), 50, onSetting);
  seg("pct", D.pcts, D.pcts.map(p => `${p}th`), 90, onSetting);
  seg("window", D.windows, D.windows, 15, onSetting);
  seg("speed", [1000, 400, 150], ["1×", "2.5×", "7×"], 1000, () => { if (timer) { stop(); play(); } });
  $("country").innerHTML = `<option value="0">All countries</option>` + D.countries
    .map((n, c) => [n, c]).filter(([, c]) => c && country.includes(c)).sort()
    .map(([n, c]) => `<option value="${c}">${n}</option>`).join("");
  $("zone").innerHTML = `<option value="">All zones</option>` +
    ["temperate", "cold (continental)", "arid", "polar"].map(z => `<option>${z}</option>`).join("");
  $("year").onchange = $("month").onchange = $("europe").onchange = $("country").onchange = $("zone").onchange = $("sort").onchange = onSetting;
  for (const id of ["minDays", "minArea", "minAnom"]) $(id).oninput = onSetting;
  $("reset").onclick = () => {
    $("europe").checked = true; $("country").value = 0; $("zone").value = ""; $("minDays").value = 3; $("minArea").value = 0; $("minAnom").value = 0; onSetting();
  };
  $("showTrail").onchange = $("showOther").onchange = draw;
  $("events").onclick = ev => { const li = ev.target.closest("li[data-k]"); if (li) select(+li.dataset.k); };
  $("play").onclick = () => (timer ? stop() : play());
  $("prev").onclick = () => { stop(); go(frame - 1); };
  $("next").onclick = () => { stop(); go(frame + 1); };
  const seek = ev => { const r = $("spark").getBoundingClientRect();
    stop(); go(Math.floor((ev.clientX - r.left) / r.width * frames.length)); };
  $("spark").onpointerdown = ev => { $("spark").setPointerCapture(ev.pointerId); seek(ev); };
  $("spark").onpointermove = ev => { if (ev.buttons) seek(ev); };
  $("mapwrap").onmousemove = ev => {
    const p = cellAt(ev);
    $("where").textContent = `${p.c ? D.countries[p.c] + " · " : ""}${p.lat.toFixed(2)}° N, ${p.lon.toFixed(2)}° E`;
  };
  $("mapwrap").onclick = ev => {
    if (ev.target.closest(".pop, .legend")) return;
    const p = cellAt(ev), pop = $("pop");
    if (!p.c) { pop.hidden = true; return; }
    const share = selected && shares(selected).find(([c]) => c === p.c);
    pop.innerHTML = `<b>${D.countries[p.c]}</b><small>${p.lat.toFixed(2)}° N, ${p.lon.toFixed(2)}° E</small>
      <small>${selected ? (share ? `${pct(share[1])} of this event` : "Not touched by this event") : ""}</small>
      <button class="link" id="popFilter">Show events in ${D.countries[p.c]}</button>`;
    pop.style.left = `${Math.min(Math.max(p.x, 90), $("mapwrap").clientWidth - 90)}px`;
    pop.style.top = `${Math.max(p.y, 110)}px`;
    pop.hidden = false;
    $("popFilter").onclick = () => {
      $("country").value = p.c; document.querySelector(".filters").open = true; pop.hidden = true; onSetting();
    };
  };
  $("mapwrap").onmouseleave = () => { $("where").textContent = ""; };
  document.onkeydown = ev => {
    if (ev.key === "Escape") $("pop").hidden = true;
    if (["SELECT", "INPUT"].includes(ev.target.tagName)) return;
    const sel = [...$("events").children].findIndex(li => li.getAttribute("aria-selected") === "true");
    const act = { " ": () => (timer ? stop() : play()), ArrowLeft: () => { stop(); go(frame - 1); },
                  ArrowRight: () => { stop(); go(frame + 1); },
                  ArrowUp: () => select(Math.max(0, sel - 1)),
                  ArrowDown: () => select(Math.min(events.length - 1, sel + 1)) }[ev.key];
    if (act && events.length) { ev.preventDefault(); act(); }
  };
  new ResizeObserver(() => { drawOverlay(); drawSpark(); }).observe($("mapwrap"));
  matchMedia("(prefers-color-scheme: dark)").onchange = () => { drawOverlay(); draw(); };
  let theme = "system";
  try { theme = localStorage.getItem("hwcat-theme") || "system"; } catch {}
  const applyTheme = t => {
    if (t === "system") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    try { localStorage.setItem("hwcat-theme", t); } catch {}
    drawOverlay(); draw();
  };
  seg("theme", ["light", "dark", "system"], ["Light", "Dark", "System"], theme, () => applyTheme(val("theme")));
  if (theme !== "system") document.documentElement.dataset.theme = theme;
  onSetting();
})();
</script>
</body>
</html>
