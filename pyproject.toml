[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwcat"
version = "0.1.1"
description = "Gridded heat-wave catalogues from ERA5 (CTX90pct) and a check of how their rankings depend on the detector's settings"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy", "pandas", "xarray", "dask", "scipy", "netCDF4", "matplotlib"]

[project.optional-dependencies]
download = ["cdsapi"]

[project.scripts]
hwcat = "hwcat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hwcat = ["data/*.npz", "data/*.json"]
